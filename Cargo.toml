[package]
name = "scd"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Tobias Kragholm <50784887+tkragholm@users.noreply.github.com>"]
description = "Canonical definition of severe chronic disease (SCD) classification from ICD-10 diagnosis codes."
repository = "https://github.com/tkragholm/scd-algorithm"
readme = "README.md"
license = "MIT"
# Private crate consumed via git dependency; never published to crates.io.
publish = false

[lib]
name = "scd"

[dependencies]
# Git revision until epistat-register is released with the icd10 module.
epistat-register = { git = "https://github.com/tkragholm/epistat", rev = "b1198bfd38873e053b411578dd44d70723abab29", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
